openapi: 3.2.0
info:
  title: Serbia Data Company API
  version: 0.1.0
  description: Normalized Serbian company registry and latest financial-statement summaries from official APR high-value open data.
  license:
    name: Serbian Open Data License 1.0
    identifier: SODL-1.0
    url: https://data.gov.rs/sr/terms/
  contact:
    url: https://serbia-company-x402.vercel.app
  x-guidance: Use exact lookup when you have an 8-digit Serbian registration number. Use name search for discovery, including Serbian Latin or Cyrillic. All monetary fields use thousand_RSD.
servers:
- url: https://serbia-company-x402.vercel.app
tags:
- name: Company
paths:
  /api/company:
    get:
      operationId: getSerbianCompany
      summary: Get one Serbian company profile
      parameters:
      - name: mb
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{8}$
        example: '07044275'
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.01'
        protocols:
        - x402: {}
      responses:
        '200':
          description: Official company profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    type: object
                    properties:
                      registrationNumber:
                        type: string
                        pattern: ^\d{8}$
                      businessName:
                        type:
                        - string
                        - 'null'
                      status:
                        type:
                        - string
                        - 'null'
                      incorporationDate:
                        type:
                        - string
                        - 'null'
                        format: date
                      legalForm:
                        type:
                        - string
                        - 'null'
                      activityCode:
                        type:
                        - string
                        - number
                        - 'null'
                      latestFinancialStatement:
                        type:
                        - object
                        - 'null'
                        description: Latest public APR summary. Monetary values are in thousands of Serbian dinars (RSD).
        '402':
          description: Payment Required
      tags:
      - Company
  /api/company/batch:
    post:
      operationId: batchGetSerbianCompanies
      summary: Get as many as 10 Serbian company profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - registrationNumbers
              properties:
                registrationNumbers:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    pattern: ^\d{8}$
            example:
              registrationNumbers:
              - '07044275'
              - '20047216'
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.05'
        protocols:
        - x402: {}
      responses:
        '200':
          description: Batch company results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        registrationNumber:
                          type: string
                        company:
                          type: object
                          properties:
                            registrationNumber:
                              type: string
                              pattern: ^\d{8}$
                            businessName:
                              type:
                              - string
                              - 'null'
                            status:
                              type:
                              - string
                              - 'null'
                            incorporationDate:
                              type:
                              - string
                              - 'null'
                              format: date
                            legalForm:
                              type:
                              - string
                              - 'null'
                            activityCode:
                              type:
                              - string
                              - number
                              - 'null'
                            latestFinancialStatement:
                              type:
                              - object
                              - 'null'
                              description: Latest public APR summary. Monetary values are in thousands of Serbian dinars (RSD).
        '402':
          description: Payment Required
      tags:
      - Company
