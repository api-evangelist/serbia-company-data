summary: >-
  There are no subscription plans, no tiers, no free allowance and no enterprise contract. Pricing is
  pure pay-per-call, quoted per route in USD-denominated Base USDC and enforced at request time by an
  HTTP 402 x402 challenge. Because the price is carried in the machine-readable PAYMENT-REQUIRED
  header on every unpaid call, the pricing is not just published — it is a runtime contract an agent
  can read and evaluate before signing, which is a stronger form of pricing transparency than a
  pricing page. Both the human-readable price on the landing page and the on-wire amount were captured
  and they agree.
